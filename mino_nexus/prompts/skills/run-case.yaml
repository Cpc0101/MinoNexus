id: run-case
label: 执行测试用例
summary: 用例脚本由 Scout 执行；Nexus 负责下发、准入与回调。
category: device
role: test-engineer
role_label: 测试工程师
engine: script
sop:
  phases:
  - id: prep
    job: agent-vision-plan
    tool_kinds:
    - generic
    - recovery
    guards:
    - exec_script_params
    - action_fuse
    - require_session
    - prep_clear_before_launch
    - block_prep_login_when_logged_in_required
    advance_on: milestones
    require: ''
    exec_job: agent-vision-exec
  - id: do
    job: agent-vision-plan
    tool_kinds:
    - generic
    - recovery
    guards:
    - action_fuse
    - limit_recovery_retry
    - block_assert_in_do
    - block_back_without_nav_back_semantics
    - require_session
    - block_fsm_off_step_target
    advance_on: milestones
    require: ''
    exec_job: agent-vision-exec
  - id: check
    job: agent-vision-plan
    tool_kinds:
    - check
    - recovery
    guards:
    - deny_mutate
    - force_case_expectation
    advance_on: milestones
    require: saw_assert
    exec_job: agent-vision-assert
  inspections:
  - job: inspect-session
    at: case_start
    on_fail: continue
  pointer: case_columns
  tool_kinds:
  - generic
  - check
  - recovery
  max_steps: 30
input:
  type: case
  map:
    precondition: case.precondition
    steps: case.steps
    expected: case.expected
view:
  id: case-three-column
triggers:
- case_run
- instruction
enabled: true
sort_order: 10
