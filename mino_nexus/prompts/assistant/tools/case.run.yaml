id: case.run
title: 跑用例
description: 在指定设备上执行用例，返回任务 id。用户说跑一下、执行、回归时用。
route: POST /case-runner/run
risk: write
async: true
params_schema:
  type: object
  properties:
    client_request_id:
      type: string
      maxLength: 160
      description: 本次执行意图的稳定标识；同一次请求重试保持不变，明确新一轮执行时使用新值。
    project_id:
      type: string
      description: 用户明确指定的项目 id 或名称，用于限定应用和渠道
    app_id:
      type: string
      description: 应用 id 或应用名
    env_surface:
      type: string
      description: 用户明确指定的应用渠道 id 或别名，例如 Agent/macagent；先确定渠道再筛选设备
    env_profile:
      type: string
      description: 本次运行环境，例如 test/pre/prod
    sn:
      type: string
      description: 设备序列号或别名
    modules:
      type: array
      items:
        type: string
      description: 用户明确要求多个模块时的并集，去重执行项目共享用例
    module:
      type: string
      description: 用户指定的用例模块，按项目共享用例范围精确筛选
    search:
      type: string
      description: 用户指定的用例名称关键字；不要填用例 id（id 请放 case_ids）
    ordinal:
      type: integer
      minimum: 1
      description: 当前范围内第几条用例，第一条传 1
    all_cases:
      type: boolean
      description: 仅用户明确要求整个项目全部用例时传 true
    playwright_headless:
      type: boolean
      description: 无头浏览器模式，影响资源容量与准入
    case_ids:
      type: array
      items:
        type: string
      description: 明确选择的用例 id，空列表不会执行全部
    script_targets:
      type: array
      description: 按需求直接下发脚本。有此字段时不再从用例正文展开。每一项是 requirement_id 加 case_ids；case_ids 为空则执行 tests/<需求ID>/ 下的全部脚本。脚本路径为 tests/<需求ID>/<用例ID>.py。
      items:
        type: object
        properties:
          requirement_id:
            type: string
          case_ids:
            type: array
            items:
              type: string
    revision:
      type: string
      description: 脚本所在的 git 提交 SHA，必须已 push 到项目仓库。Nexus 不校验，原样交给 Scout；Scout 自己拉取仓库，在该提交上读脚本，远端找不到由 Scout 返回 revision_missing，不回退到分支最新。不传则 Scout 取分支最新。
  required:
  - app_id
param_resolvers:
  project_id: project.by_name
  app_id: app.by_name
  env_surface: channel.by_name
  sn: device.by_alias
result_pick:
- data.task_id
- data.run_id
- data.id
card: case_run_started
surfaces:
- im
- mcp
enabled: true
followup_card: case_run_finished
