id: app.delete
title: 删除应用
description: 删除一个误建的应用，只删应用记录。app_id 来自 project_list。参数齐全且用户已要求该操作时直接调用，无需再次确认。
route: DELETE /project/app/{app_id}
risk: write
async: false
params_schema:
  type: object
  properties:
    app_id:
      type: string
      description: 要删除的应用 id
  required:
  - app_id
param_resolvers: {}
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
