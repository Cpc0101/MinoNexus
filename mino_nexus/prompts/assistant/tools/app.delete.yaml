id: app.delete
title: 删除应用
description: 删除一个误建的应用，只删应用记录。app_id 来自 project_list。调用后服务端弹出删除确认窗。不要在对话里先追问，直接调用。
route: DELETE /project/app/{app_id}
risk: write
async: false
params_schema:
  type: object
  properties:
    app_id:
      type: string
      description: 要删除的应用 id
  required:
  - app_id
param_resolvers: {}
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
