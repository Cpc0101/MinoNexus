id: resource.account.update
title: 修改测试账号
description: 修改 Nexus 测试账号池中的账号；仅传要修改的字段。参数齐全且用户已要求该操作时直接调用，无需再次确认。
route: PATCH /project/{project_id}/accounts/{account_id}
risk: write
async: false
version: 1
params_schema:
  type: object
  additionalProperties: false
  properties:
    project_id:
      type: string
      minLength: 1
    account_id:
      type: string
      minLength: 1
    env:
      type: string
    display_name:
      type: string
    phone:
      type: string
    email:
      type: string
    username:
      type: string
    password:
      type: string
    otp:
      type: string
    kind:
      type: string
    profile_id:
      type: string
    note:
      type: string
    facets:
      type: object
      additionalProperties: true
    locked:
      type: boolean
  required:
  - project_id
  - account_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
