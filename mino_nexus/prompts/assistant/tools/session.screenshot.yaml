id: session.screenshot
title: 读取会话截图
description: 读取本人会话指定事件已有的完整截图。先用 session_events 找到带 image 类型 artifact_id 的 Scout 事件，或旧会话的 observe/screen 事件 seq。经原执行节点读取已保存证据，不重新截图、不操作设备。离线、过期、缺失明确报错。
route: GET /case-runner/sessions/{session_id}/screenshot
risk: read
async: false
params_schema:
  type: object
  properties:
    session_id: {type: string}
    seq: {type: integer, minimum: 0}
  required: [session_id, seq]
param_resolvers: {}
result_pick: [data]
surfaces: [mcp]
enabled: true
