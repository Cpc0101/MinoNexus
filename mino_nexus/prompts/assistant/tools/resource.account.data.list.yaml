id: resource.account.data.list
title: 账号数据记录
description: 查询账号的对象引用、特征和最近的数据需求描述；仅辅助选数，缺记录不阻塞。缺数据由 Agent 决定查找或构造。
route: GET /project/{project_id}/resources/accounts/{account_id}/data
risk: read
async: false
version: 1
params_schema:
  type: object
  additionalProperties: false
  properties:
    project_id: {type: string}
    account_id: {type: string}
    app_id: {type: string}
    kind: {type: string}
    limit: {type: integer, minimum: 1, maximum: 200, default: 50}
    offset: {type: integer, minimum: 0, default: 0}
    request_limit: {type: integer, minimum: 1, maximum: 200, default: 20}
    request_offset: {type: integer, minimum: 0, default: 0}
  required:
  - project_id
  - account_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true

