id: agent.workflow.init
title: 初始化 Agent 进度
description: 在 Nexus 保存当前用户的范围、独立工作项和调查预算，不执行用例或创建业务数据。相同 workflow_id 的范围与预算不可改写。
route: POST /assistant/workflows/{workflow_id}/init
risk: write
async: false
version: 1
params_schema: {"type":"object","additionalProperties":false,"properties":{"workflow_id":{"type":"string","minLength":1,"maxLength":128},"scope":{"type":"string","minLength":1,"maxLength":2000},"units":{"type":"array","minItems":1,"maxItems":1000,"items":{"type":"string","minLength":1,"maxLength":128}},"stage_budget":{"type":"integer","minimum":1,"maximum":10000,"default":6},"total_budget":{"type":"integer","minimum":1,"maximum":10000,"default":24}},"required":["workflow_id","scope","units"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
