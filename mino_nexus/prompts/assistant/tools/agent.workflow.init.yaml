id: agent.workflow.init
title: 初始化 Agent 进度
description: 从成功 source_read_id 锁定原文全集，保存轮数和累计调查时间预算。每阶段默认300秒，总计默认max(1800,expected_total×120)秒；相同工作流不能改预算。预算仅约束继续调查，不取消已提交测试，不降低预期或将缺口算通过。
route: POST /assistant/workflows/{workflow_id}/init
risk: write
async: false
version: 3
params_schema: {"type":"object","additionalProperties":false,"properties":{"workflow_id":{"type":"string","minLength":1,"maxLength":128},"scope":{"type":"string","minLength":1,"maxLength":2000},"source_read_id":{"type":"string","minLength":1,"maxLength":128,"description":"case.source.read 成功回执中的 read_id；Nexus 会校验 owner、generation、内容哈希与完整用例行"},"units":{"type":"array","maxItems":1000,"items":{"type":"string","minLength":1,"maxLength":128},"description":"首批 delivery hint，必须是服务端 expected_units 的子集；省略时登记全部，后续 start 可继续 expected_units 内条目"},"stage_budget":{"type":"integer","minimum":1,"maximum":10000,"default":6},"total_budget":{"type":"integer","minimum":1,"maximum":10000},"stage_time_budget_sec":{"type":"integer","minimum":1,"maximum":604800,"description":"每个用例每个阶段的累计调查秒数，默认1800，仅供Agent评估；包括该调查内等待，不作为拒绝执行或设备取消时限"},"total_time_budget_sec":{"type":"integer","minimum":1,"maximum":604800,"description":"整个工作流累计调查秒数，默认max(14400,expected_total×600)，仅供Agent评估；超出可基于进展继续，禁止重建工作流重置预算"}},"required":["workflow_id","scope","source_read_id"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
