{
  "id": "debug.case",
  "title": "启动本机调试会话",
  "description": "直接绑定本机 Scout 的编写工作区，不拉仓、不要求 commit；远端节点仅供正式执行。返回 session_id，后续分段执行保留设备与应用状态。",
  "route": "POST /case-runner/debug",
  "risk": "write",
  "async": false,
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "app_id": {
        "type": "string",
        "description": "项目中的应用记录 id 或应用名"
      },
      "sn": {
        "type": "string",
        "description": "设备目标；优先传 device.list 返回的应用级逻辑 SN，也可传 physical_sn。不要自行拼接应用名和渠道。"
      },
      "node_id": {
        "type": "string",
        "description": "本地 Scout 节点 id"
      },
      "app_key": {
        "type": "string",
        "description": "脚本仓库 config.yaml 中的应用 key"
      },
      "workspace": {
        "type": "string",
        "description": "本地 Scout 的编写工作区绝对路径"
      },
      "client_request_id": {
        "type": "string",
        "description": "本次调试会话的稳定标识"
      },
      "project_id": {
        "type": "string",
        "description": "项目 id 或名称"
      },
      "env_profile": {
        "type": "string",
        "description": "本次运行环境，例如 test/pre/prod"
      },
      "env_surface": {
        "type": "string",
        "description": "应用渠道 id 或别名；未传时按应用和设备自动选择唯一渠道"
      }
    },
    "required": [
      "app_id",
      "sn",
      "node_id",
      "app_key",
      "workspace",
      "client_request_id"
    ]
  },
  "param_resolvers": {
    "project_id": "project.by_name",
    "app_id": "app.by_name",
    "env_surface": "channel.by_name",
    "sn": "device.by_alias"
  },
  "result_pick": [
    "data"
  ],
  "surfaces": [
    "mcp"
  ],
  "enabled": true
}
