id: resource.account.get
title: 测试账号详情
description: 按应用范围读取单个测试账号的 facets、租约、绑定的机态记录和最近 10 条资源日志。响应只返回账号元数据与凭据配置状态，绝不返回密码或验证码。用户问“这个号什么状态/为什么被占用”时用。
route: GET /project/{project_id}/resources/accounts/{account_id}
risk: read
async: false
version: 1
params_schema:
  type: object
  properties:
    project_id:
      type: string
      description: 项目 id 或项目名
    account_id:
      type: string
      description: 账号 id，必须来自 resource.account.list，不要用手机号猜
    app_id:
      type: string
      minLength: 1
      maxLength: 80
      description: 必填；账号必须在该应用的生效范围内
  required:
  - project_id
  - account_id
  - app_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
