id: agent.workflow.start
title: 记录 Agent 调查开始
description: 原子消耗调查预算并识别重复阻塞，返回当前 coverage。预算耗尽且 missing/verification_missing 非空时必须报告缺口；存在 blocked_units 时逐条列出。只有 all_implemented=true 才能说脚本全集写齐，只有 all_verified=true 才能说正式全集通过；implementation_complete/verification_complete 不是全通过的同义词。allowed=true 仅表示预算允许，不授予新的执行权限。
route: POST /assistant/workflows/{workflow_id}/start
risk: write
async: false
version: 1
params_schema: {"type":"object","additionalProperties":false,"properties":{"workflow_id":{"type":"string","minLength":1,"maxLength":128},"attempt_id":{"type":"string","minLength":1,"maxLength":128},"unit":{"type":"string","minLength":1,"maxLength":128},"stage":{"type":"string","enum":["analysis","authoring","preparation","verification"]},"action":{"type":"string","minLength":1,"maxLength":500},"writes":{"type":"boolean","default":false},"blocker":{"type":"string","maxLength":2000},"evidence":{"type":"array","maxItems":64,"items":{"type":"string","minLength":1,"maxLength":2000}}},"required":["workflow_id","attempt_id","unit","stage","action"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
