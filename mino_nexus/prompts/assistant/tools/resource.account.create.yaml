id: resource.account.create
title: 新增测试账号
description: 向当前项目的 Nexus 测试账号池新增账号。必须绑定至少一个当前项目应用；环境与登录身份用于租用匹配。请求不得携带密码或固定验证码，响应只返回凭据配置状态。参数齐全且用户已要求该操作时直接调用，无需再次确认。
route: POST /project/{project_id}/accounts
risk: write
async: false
version: 1
params_schema:
  type: object
  additionalProperties: false
  properties:
    project_id:
      type: string
      minLength: 1
    app_ids:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 80
      description: 生效应用，至少一个且必须属于当前项目；可多选
    env:
      type: string
    display_name:
      type: string
    phone:
      type: string
    email:
      type: string
    username:
      type: string
    kind:
      type: string
    profile_id:
      type: string
    note:
      type: string
    facets:
      type: object
      additionalProperties: true
    locked:
      type: boolean
  required:
  - project_id
  - app_ids
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
