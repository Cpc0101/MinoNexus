id: resource.env.get
title: 项目环境配置
description: 读取项目在 Nexus 保存的环境、渠道、登录策略、验证码策略和自动新增账号序列。
route: GET /project/{project_id}/env
risk: read
async: false
version: 1
params_schema:
  type: object
  additionalProperties: false
  properties:
    project_id:
      type: string
      minLength: 1
  required:
  - project_id
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
