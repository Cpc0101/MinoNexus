id: agent.workflow.finish
title: 记录 Agent 调查结果
description: 保存调查事实、coverage、耗时和结构化help_request；求助仅用于blocked/deferred，列出缺口、已查来源和受影响原文ID。返回requires_visible_receipt时立即在对话输出，不等最终报告。verification complete必须引用本人原Scout任务，服务端核验该用例所有设备执行的封存原文断言、覆盖与上下文；局部通过、调试或准备不计正式通过。
route: POST /assistant/workflows/{workflow_id}/finish
risk: write
async: false
version: 1
params_schema: {"type":"object","additionalProperties":false,"properties":{"workflow_id":{"type":"string","minLength":1,"maxLength":128},"attempt_id":{"type":"string","minLength":1,"maxLength":128},"outcome":{"type":"string","enum":["progress","blocked","complete","failed","deferred"]},"evidence":{"type":"array","maxItems":64,"items":{"type":"string","minLength":1,"maxLength":2000}},"blocker":{"type":"string","maxLength":2000},"task_id":{"type":"string","maxLength":128},"write_outcome":{"type":"string","enum":["known","unknown"],"default":"known"},"note":{"type":"string","maxLength":2000},"help_request":{"type":"object","additionalProperties":false,"properties":{"question":{"type":"string","minLength":1,"maxLength":2000},"missing":{"type":"string","minLength":1,"maxLength":2000},"checked_sources":{"type":"array","maxItems":64,"items":{"type":"string","minLength":1,"maxLength":2000}},"affected_units":{"type":"array","minItems":1,"maxItems":1000,"items":{"type":"string","minLength":1,"maxLength":128}}},"required":["question","missing","checked_sources","affected_units"]}},"required":["workflow_id","attempt_id","outcome"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
