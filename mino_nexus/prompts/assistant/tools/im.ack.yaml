id: im.ack
version: 1
title: 确认已处理 IM 消息
description: >-
  把 im.inbox 返回的条目 id 标记为已处理，之后 im.inbox 不再返回它们。
  只处理本人条目；不是本人的 id 会出现在 missing 里，不报错。
  回复完消息或确认无需回复时都要 ack，否则条目会一直留在 pending。
route: POST /assistant/im/ack
risk: write
async: false
timeout_sec: 30
params_schema:
  type: object
  additionalProperties: false
  properties:
    ids:
      type: array
      minItems: 1
      maxItems: 50
      items: {type: string}
      description: 要标记为已处理的条目 id，来自 im.inbox 返回的 items[].id
  required: [ids]
result_pick: [data]
surfaces: [mcp]
enabled: true
