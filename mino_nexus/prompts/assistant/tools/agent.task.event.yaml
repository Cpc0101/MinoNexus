id: agent.task.event
title: 上报 Agent 当前动作
description: 上报可核实的当前动作、文件或用例与证据引用，不上传私密思维链、凭据或完整工具载荷。活跃工具未核对时不能结束任务。
route: POST /assistant/agent-tasks/{task_id}/event
risk: write
async: false
version: 1
params_schema: {"type": "object", "additionalProperties": false, "properties": {"task_id": {"type": "string", "minLength": 1, "maxLength": 128}, "event_id": {"type": "string", "minLength": 1, "maxLength": 128}, "status": {"type": "string", "enum": ["running", "waiting_tool", "waiting_user", "paused", "completed", "failed", "cancelled"]}, "summary": {"type": "string", "minLength": 1, "maxLength": 2000}, "evidence": {"type": "array", "maxItems": 64, "items": {"type": "string", "minLength": 1, "maxLength": 2000}}, "phase": {"type": "string", "enum": ["analysis", "case_design", "authoring", "preparation", "verification", "report"]}, "startup_delivered": {"type": "boolean", "description": "先在可见对话发出 startup_message，再用本 event 确认；summary 必须含返回的 board_url。仅为客户端发送声明，不代表用户已读。"}, "scope": {"type": "string", "minLength": 1, "maxLength": 2000}, "environment": {"type": "string", "minLength": 1, "maxLength": 2000}, "next_action": {"type": "string", "minLength": 1, "maxLength": 2000}}, "required": ["task_id", "event_id", "summary"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
