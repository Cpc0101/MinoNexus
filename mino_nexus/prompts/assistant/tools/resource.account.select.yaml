id: resource.account.select
title: 按业务数据选号
description: 按独立资产记忆排序当前应用范围内的空闲账号。数据与标签仅辅助选择，无匹配仍返回候选；不预约、不认证资产可用性，实际执行仍按身份、环境、应用范围与租约约束租号。响应不返回凭据值。
route: POST /project/{project_id}/resources/accounts/select
risk: read
async: false
version: 1
params_schema:
  type: object
  properties:
    project_id:
      type: string
    app_id:
      type: string
      minLength: 1
      maxLength: 80
      description: 必填；只选择生效范围包含该应用的账号
    env:
      type: string
    data_requirements:
      type: array
      maxItems: 20
      items:
        type: object
        properties:
          kind:
            type: string
          object_ref:
            type: string
          attributes:
            type: object
        required: [kind]
  required: [project_id, app_id]
param_resolvers:
  project_id: project.by_name
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
