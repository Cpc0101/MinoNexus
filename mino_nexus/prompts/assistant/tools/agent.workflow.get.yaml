id: agent.workflow.get
title: 读取 Agent 进度
description: 读取原文全集、coverage、四阶段进度、time_budget与help_requests。overdue_attempts只说明调查超限，不证明设备停止；先核对原任务。只有all_verified=true及正式Scout证据才可说全集通过，blocked/failed/deferred必须单列。求助问题与阶段变化立即输出可见回执。
route: GET /assistant/workflows/{workflow_id}
risk: read
async: false
version: 1
params_schema: {"type":"object","additionalProperties":false,"properties":{"workflow_id":{"type":"string","minLength":1,"maxLength":128}},"required":["workflow_id"]}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
