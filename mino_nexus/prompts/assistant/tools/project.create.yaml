id: project.create
title: 创建项目
description: 创建一个项目，返回项目 id。name 必填，description 可选。调用后服务端弹出确认窗，用户可以修改名称和说明。不要在对话里先追问，直接调用。
route: POST /project/create
risk: write
async: false
params_schema:
  type: object
  properties:
    name:
      type: string
      description: 项目名称，1 到 200 字
    description:
      type: string
      description: 项目说明，可空，最长 2000 字
  required:
  - name
param_resolvers: {}
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
