id: agent.task.list
title: 读取 Agent list
description: 读取当前账号真实运行状态、问题答案与关联；事件按seq分页。外部未上报的行为未知，不由workflow进度推断。
route: GET /assistant/agent-tasks
risk: read
async: false
version: 1
params_schema: {"type": "object", "additionalProperties": false, "properties": {"project_id": {"type": "string", "minLength": 1, "maxLength": 128}, "limit": {"type": "integer", "minimum": 1, "maximum": 100}, "offset": {"type": "integer", "minimum": 0}, "view": {"type": "string", "enum": ["tasks", "calls", "all"], "default": "tasks"}}, "required": []}
result_pick: [data]
card: answer
surfaces: [mcp]
enabled: true
