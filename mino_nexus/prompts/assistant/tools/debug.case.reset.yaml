{
  "id": "debug.case.reset",
  "title": "重置调试现场",
  "description": "关闭并重新启动绑定应用，清除片段变量，保留租约和证据；未知写结果不允许重置。",
  "route": "POST /case-runner/debug/{session_id}/reset",
  "risk": "write",
  "async": false,
  "params_schema": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "session_id": {
        "type": "string"
      },
      "client_request_id": {
        "type": "string"
      },
      "timeout_sec": {
        "type": "number",
        "minimum": 1,
        "maximum": 3600
      }
    },
    "required": [
      "session_id",
      "client_request_id"
    ]
  },
  "param_resolvers": {},
  "result_pick": [
    "data"
  ],
  "surfaces": [
    "mcp"
  ],
  "enabled": true
}
