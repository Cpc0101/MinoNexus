id: resource.env.set
title: 保存项目环境配置
description: 保存项目在 Nexus 的环境配置。登录方式、验证码策略、Gmail 收件箱、应用级登录策略和手机号/邮箱别名序列放在这里，不写入脚本仓；只有 login.mode=auto 才会在缺号时自动补号，pool 只租号池已有账号，hitl 转人工。login_policies 中 selected 策略优先于 all，同一应用不能被多条 selected 重复定义。可只传要修改的顶层字段。
route: PUT /project/{project_id}/env
risk: write
async: false
version: 1
params_schema:
  type: object
  additionalProperties: false
  properties:
    project_id:
      type: string
      minLength: 1
    env:
      type: object
      description: 要合并保存的项目环境字段
      additionalProperties: true
  required:
  - project_id
  - env
param_resolvers:
  project_id: project.by_name
result_pick:
- data
card: answer
surfaces:
- mcp
enabled: true
