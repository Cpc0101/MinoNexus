name: mino-production
services:
  nexus:
    image: hkccr.ccs.tencentyun.com/mino/mino-nexus:${MINO_NEXUS_IMAGE_TAG:?Set an explicit immutable image tag, such as 0.1.53-<full-commit-sha>}
    build:
      context: .
    ports:
      - "${MINO_BIND_ADDRESS:-127.0.0.1}:50104:50104"
    volumes:
      - mino-data:/data
    environment:
      MINO_NEXUS_PUBLIC_URL: ${MINO_NEXUS_PUBLIC_URL:-}
      MINO_WORKBENCH_PUBLIC_URL: ${MINO_WORKBENCH_PUBLIC_URL:-}
      MINO_SCOUT_MANIFEST_URL: ${MINO_SCOUT_MANIFEST_URL:-}
      MINO_WORKBENCH_ORIGINS: ${MINO_WORKBENCH_ORIGINS:-}
      # Trust forwarded scheme only from explicitly configured reverse-proxy IPs.
      FORWARDED_ALLOW_IPS: ${MINO_PROXY_IPS:-127.0.0.1}
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  mino-data:
