name: Deploy Tencent Cloud

on:
  workflow_call:
    inputs:
      version:
        description: Released Nexus version, with or without the leading v
        required: true
        type: string
      image_tag:
        description: Immutable TCR tag, formatted as VERSION-FULL_GIT_SHA
        required: true
        type: string
    secrets:
      TENCENT_SSH_PRIVATE_KEY:
        required: true
      MINO_NEXUS_CREDENTIAL_MASTER_KEY:
        required: true
      TCR_USERNAME:
        required: true
      TCR_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released Nexus version, with or without the leading v
        required: true
        type: string
      image_tag:
        description: Immutable TCR tag, formatted as VERSION-FULL_GIT_SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-tencent-nexus
  cancel-in-progress: false

env:
  TENCENT_HOST: ${{ vars.TENCENT_HOST }}
  TENCENT_USER: ${{ vars.TENCENT_USER }}
  TENCENT_DEPLOY_DIR: ${{ vars.TENCENT_DEPLOY_DIR }}
  TENCENT_HOST_KEY_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
  # Public HTTPS uses the unblocked :8443 port. Workbench and Nexus remain separate origins.
  MINO_NEXUS_PUBLIC_URL: ${{ vars.MINO_NEXUS_PUBLIC_URL || 'https://nexus.minocc.top:8443' }}
  MINO_WORKBENCH_PUBLIC_URL: ${{ vars.MINO_WORKBENCH_PUBLIC_URL || 'https://workbench.minocc.top:8443' }}
  MINO_NEXUS_HEALTH_URL: ${{ vars.MINO_NEXUS_HEALTH_URL || 'https://nexus.minocc.top:8443/health' }}
  MINO_WORKBENCH_URL: ${{ vars.MINO_WORKBENCH_URL || 'https://workbench.minocc.top:8443/BUILD.json' }}
  MINO_SCOUT_MANIFEST_URL: ${{ vars.MINO_SCOUT_MANIFEST_URL || 'https://nexus.minocc.top:8443/scout-release/manifest.json' }}
  MINO_WORKBENCH_ORIGINS: ${{ vars.MINO_WORKBENCH_ORIGINS || 'https://workbench.minocc.top:8443' }}
  TCR_REGISTRY: hkccr.ccs.tencentyun.com
  TCR_IMAGE: hkccr.ccs.tencentyun.com/mino/mino-nexus

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          CREDENTIAL_MASTER_KEY: ${{ secrets.MINO_NEXUS_CREDENTIAL_MASTER_KEY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          version=${REQUESTED_VERSION#v}
          image_tag=$REQUESTED_IMAGE_TAG
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "Invalid version: $REQUESTED_VERSION" >&2; exit 1 ;;
          esac
          if [ "$image_tag" = latest ]; then
            echo 'Refusing to deploy the mutable latest image tag.' >&2
            exit 1
          fi
          image_sha=${image_tag#"$version-"}
          if [[ "$image_tag" != "$version-"* ]] || ! [[ "$image_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable image tag for version $version: $image_tag" >&2
            exit 1
          fi
          test -n "$TCR_USERNAME" || { echo 'Missing repository secret TCR_USERNAME' >&2; exit 1; }
          test -n "$TCR_PASSWORD" || { echo 'Missing repository secret TCR_PASSWORD' >&2; exit 1; }
          test -n "$CREDENTIAL_MASTER_KEY" || { echo 'Missing repository secret MINO_NEXUS_CREDENTIAL_MASTER_KEY' >&2; exit 1; }
          MINO_NEXUS_CREDENTIAL_MASTER_KEY="$CREDENTIAL_MASTER_KEY" python3 -c 'import base64, os; value = os.environ["MINO_NEXUS_CREDENTIAL_MASTER_KEY"].strip(); raw = base64.urlsafe_b64decode(value + "=" * (-len(value) % 4)); assert len(raw) == 32, "MINO_NEXUS_CREDENTIAL_MASTER_KEY must decode to exactly 32 bytes"'
          test -n "$TENCENT_HOST" || { echo 'Missing repository variable TENCENT_HOST' >&2; exit 1; }
          test -n "$TENCENT_USER" || { echo 'Missing repository variable TENCENT_USER' >&2; exit 1; }
          if [ -n "$TENCENT_DEPLOY_DIR" ]; then
            case "$TENCENT_DEPLOY_DIR" in
              /|*/|*[!A-Za-z0-9._/-]*) echo "Unsafe TENCENT_DEPLOY_DIR: $TENCENT_DEPLOY_DIR" >&2; exit 1 ;;
            esac
          else
            echo 'TENCENT_DEPLOY_DIR is not set; it will be resolved from the live mino-production container.'
          fi
          test -n "$TENCENT_HOST_KEY_FINGERPRINT" || { echo 'Missing repository variable TENCENT_HOST_KEY_FINGERPRINT' >&2; exit 1; }

          nexus_public_url=${MINO_NEXUS_PUBLIC_URL%/}
          workbench_public_url=${MINO_WORKBENCH_PUBLIC_URL%/}
          nexus_health_url=${MINO_NEXUS_HEALTH_URL}
          workbench_url=${MINO_WORKBENCH_URL}
          scout_manifest_url=${MINO_SCOUT_MANIFEST_URL}
          workbench_origins=${MINO_WORKBENCH_ORIGINS%/}
          for origin in "$nexus_public_url" "$workbench_public_url"; do
            case "$origin" in
              https://*/*) echo "Public origin must not contain a path: $origin" >&2; exit 1 ;;
              https://*:8443) ;;
              *) echo "Public origin must use https:// and :8443: $origin" >&2; exit 1 ;;
            esac
            host=${origin#https://}
            case "$host" in
              ''|*/*|*[!A-Za-z0-9.:-]*) echo "Invalid public origin host: $host" >&2; exit 1 ;;
            esac
          done
          case "$nexus_health_url" in "$nexus_public_url"/*) ;; *) echo "Nexus health URL is outside $nexus_public_url: $nexus_health_url" >&2; exit 1 ;; esac
          case "$workbench_url" in "$workbench_public_url"/*) ;; *) echo "Workbench URL is outside $workbench_public_url: $workbench_url" >&2; exit 1 ;; esac
          case "$scout_manifest_url" in "$nexus_public_url"/*) ;; *) echo "Scout manifest URL is outside $nexus_public_url: $scout_manifest_url" >&2; exit 1 ;; esac
          test "$workbench_origins" = "$workbench_public_url" || {
            echo "MINO_WORKBENCH_ORIGINS must contain only $workbench_public_url: $workbench_origins" >&2
            exit 1
          }
          echo "NEXUS_VERSION=$version" >> "$GITHUB_ENV"
          echo "NEXUS_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "MINO_NEXUS_PUBLIC_URL=$nexus_public_url" >> "$GITHUB_ENV"
          echo "MINO_WORKBENCH_PUBLIC_URL=$workbench_public_url" >> "$GITHUB_ENV"
          echo "MINO_NEXUS_HEALTH_URL=$nexus_health_url" >> "$GITHUB_ENV"
          echo "MINO_WORKBENCH_URL=$workbench_url" >> "$GITHUB_ENV"
          echo "MINO_SCOUT_MANIFEST_URL=$scout_manifest_url" >> "$GITHUB_ENV"
          echo "MINO_WORKBENCH_ORIGINS=$workbench_origins" >> "$GITHUB_ENV"
          echo "NEXUS_PUBLIC_HOST=${nexus_public_url#https://}" >> "$GITHUB_ENV"
          echo "WORKBENCH_PUBLIC_HOST=${workbench_public_url#https://}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mino-nexus-deploy
          chmod 0600 ~/.ssh/mino-nexus-deploy
          ssh-keygen -y -f ~/.ssh/mino-nexus-deploy > /dev/null
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR == 1 {print $2}')
          test "$actual" = "$TENCENT_HOST_KEY_FINGERPRINT" || {
            echo "Tencent host fingerprint mismatch: expected $TENCENT_HOST_KEY_FINGERPRINT, got $actual" >&2
            exit 1
          }

      - name: Verify remote Docker
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "docker version --format '{{.Server.Version}}' && docker compose version"

      - name: Ensure immutable Nexus image on Tencent
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          image="$TCR_IMAGE:$NEXUS_IMAGE_TAG"
          if ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes \
            "$TENCENT_USER@$TENCENT_HOST" "docker image inspect '$image' > /dev/null 2>&1"; then
            echo "Nexus image already exists on Tencent: $image"
            exit 0
          fi

          printf '%s' "$TCR_PASSWORD" | ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes \
            "$TENCENT_USER@$TENCENT_HOST" "
              set -euo pipefail
              trap 'docker logout $TCR_REGISTRY >/dev/null 2>&1 || true' EXIT
              docker login '$TCR_REGISTRY' --username '$TCR_USERNAME' --password-stdin > /dev/null
              for attempt in 1 2 3 4 5 6; do
                echo "Pulling $image (attempt \$attempt)"
                if timeout 10m docker pull --platform linux/amd64 '$image'; then
                  exit 0
                fi
                echo 'Pull connection failed; retrying after 15s' >&2
                sleep 15
              done
              exit 1
            "
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes \
            "$TENCENT_USER@$TENCENT_HOST" "docker image inspect '$image' > /dev/null"
          echo "Pulled immutable Nexus image on Tencent: $image"

      - name: Resolve deployment directory
        run: |
          set -euo pipefail
          if [ -n "$TENCENT_DEPLOY_DIR" ]; then
            echo "Using configured deployment directory: $TENCENT_DEPLOY_DIR"
            exit 0
          fi
          ssh_cmd=(ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST")
          container_id=$("${ssh_cmd[@]}" "docker ps -aq --filter volume=mino-production_mino-data | head -n 1")
          test -n "$container_id" || {
            echo 'Cannot resolve TENCENT_DEPLOY_DIR: no container uses volume mino-production_mino-data.' >&2
            exit 1
          }
          project=$("${ssh_cmd[@]}" "docker inspect --format '{{index .Config.Labels \"com.docker.compose.project\"}}' '$container_id'")
          deploy_dir=$("${ssh_cmd[@]}" "docker inspect --format '{{index .Config.Labels \"com.docker.compose.project.working_dir\"}}' '$container_id'")
          test "$project" = mino-production || {
            echo "Refusing deployment: live volume belongs to Compose project '$project', not mino-production." >&2
            exit 1
          }
          case "$deploy_dir" in
            ''|/|*/|*[!A-Za-z0-9._/-]*) echo "Unsafe resolved deployment directory: $deploy_dir" >&2; exit 1 ;;
          esac
          echo "TENCENT_DEPLOY_DIR=$deploy_dir" >> "$GITHUB_ENV"
          echo "Resolved deployment directory from live volume: $deploy_dir"

      - name: Install production credential key
        env:
          CREDENTIAL_MASTER_KEY: ${{ secrets.MINO_NEXUS_CREDENTIAL_MASTER_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CREDENTIAL_MASTER_KEY" | \
            ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" "
              set -euo pipefail
              umask 077
              install -d -m 0700 '$TENCENT_DEPLOY_DIR/.secrets'
              cat > '$TENCENT_DEPLOY_DIR/.secrets/credential-master.key'
              chown 10001:10001 '$TENCENT_DEPLOY_DIR/.secrets/credential-master.key'
              chmod 0400 '$TENCENT_DEPLOY_DIR/.secrets/credential-master.key'
            "
          echo "MINO_NEXUS_CREDENTIAL_MASTER_KEY_FILE=$TENCENT_DEPLOY_DIR/.secrets/credential-master.key" >> "$GITHUB_ENV"
          echo 'Installed the production credential keyring outside the repository and database backup.'

      - name: Upload deployment files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "mkdir -p '$TENCENT_DEPLOY_DIR'"
          scp -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes docker-compose.yml \
            "$TENCENT_USER@$TENCENT_HOST:$TENCENT_DEPLOY_DIR/docker-compose.yml.next"
          scp -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes scripts/deploy-tencent.sh \
            "$TENCENT_USER@$TENCENT_HOST:$TENCENT_DEPLOY_DIR/.deploy-tencent.sh"

      - name: Verify production HTTPS endpoints on Tencent
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "curl --fail --silent --show-error --max-time 20 --resolve '$NEXUS_PUBLIC_HOST:127.0.0.1' '$MINO_NEXUS_HEALTH_URL' > /dev/null && curl --fail --silent --show-error --max-time 20 --resolve '$WORKBENCH_PUBLIC_HOST:127.0.0.1' '$MINO_WORKBENCH_URL' > /dev/null && curl --fail --silent --show-error --max-time 20 --resolve '$NEXUS_PUBLIC_HOST:127.0.0.1' '$MINO_SCOUT_MANIFEST_URL' > /dev/null"
          echo "Verified production HTTPS routes on port 8443"

      - name: Deploy with backup and rollback
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "MINO_DEPLOY_SKIP_PULL=1 MINO_NEXUS_PUBLIC_URL='$MINO_NEXUS_PUBLIC_URL' MINO_WORKBENCH_PUBLIC_URL='$MINO_WORKBENCH_PUBLIC_URL' MINO_SCOUT_MANIFEST_URL='$MINO_SCOUT_MANIFEST_URL' MINO_WORKBENCH_ORIGINS='$MINO_WORKBENCH_ORIGINS' MINO_NEXUS_CREDENTIAL_MASTER_KEY_FILE='$MINO_NEXUS_CREDENTIAL_MASTER_KEY_FILE' bash '$TENCENT_DEPLOY_DIR/.deploy-tencent.sh' '$NEXUS_VERSION' '$NEXUS_IMAGE_TAG' '$TENCENT_DEPLOY_DIR'"

      - name: Verify deployment from Tencent
        run: |
          set -euo pipefail
          container_id=$(ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "cd '$TENCENT_DEPLOY_DIR' && docker compose ps -q nexus")
          test -n "$container_id" || { echo 'Nexus container is not running' >&2; exit 1; }
          runtime_image=$(ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "docker inspect --format '{{.Config.Image}}' '$container_id'")
          test "$runtime_image" = "$TCR_IMAGE:$NEXUS_IMAGE_TAG"
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' '$container_id'" > /tmp/nexus-runtime-env.txt
          grep -Fx "MINO_NEXUS_PUBLIC_URL=$MINO_NEXUS_PUBLIC_URL" /tmp/nexus-runtime-env.txt
          grep -Fx "MINO_WORKBENCH_PUBLIC_URL=$MINO_WORKBENCH_PUBLIC_URL" /tmp/nexus-runtime-env.txt
          grep -Fx "MINO_SCOUT_MANIFEST_URL=$MINO_SCOUT_MANIFEST_URL" /tmp/nexus-runtime-env.txt
          grep -Fx "MINO_WORKBENCH_ORIGINS=$MINO_WORKBENCH_ORIGINS" /tmp/nexus-runtime-env.txt
          grep -Fx 'MINO_NEXUS_CREDENTIAL_MASTER_KEY_FILE=/run/secrets/credential-master.key' /tmp/nexus-runtime-env.txt
          echo 'Verified Nexus runtime public URLs and credential key mount'

      - name: Verify credential keyring
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "cd '$TENCENT_DEPLOY_DIR' && docker compose exec -T nexus python -c 'import json; from mino_nexus.resources.credential_cipher import credential_encryption_status; print(json.dumps(credential_encryption_status()))'" > /tmp/nexus-keyring.json
          python3 -c 'import json; status = json.load(open("/tmp/nexus-keyring.json")); assert status.get("configured") is True and status.get("active_key_version"), status; print("Credential keyring configured; active version " + status["active_key_version"])'
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "curl --fail --silent --show-error --max-time 20 --resolve '$NEXUS_PUBLIC_HOST:127.0.0.1' '$MINO_NEXUS_HEALTH_URL'" > /tmp/nexus-health.json
          echo 'Verified Nexus /health through the Tencent :8443 entry'
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "curl --fail --silent --show-error --max-time 20 --resolve '$NEXUS_PUBLIC_HOST:127.0.0.1' '$MINO_SCOUT_MANIFEST_URL'" > /tmp/nexus-scout-manifest.json
          echo 'Verified Scout manifest through the Tencent :8443 entry'
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "curl --fail --silent --show-error --max-time 20 --resolve '$WORKBENCH_PUBLIC_HOST:127.0.0.1' '$MINO_WORKBENCH_URL'" > /tmp/workbench-build.json
          echo 'Verified Workbench build metadata through the Tencent :8443 entry'
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/nexus-health.json').read_text())
          expected = os.environ['NEXUS_VERSION']
          actual = str(payload.get('nexus_version', ''))
          if not payload.get('ok') or actual != expected:
              raise SystemExit(f'Production verification failed: expected {expected}, got {actual}, ok={payload.get("ok")}')
          manifest = json.loads(Path('/tmp/nexus-scout-manifest.json').read_text())
          if not manifest.get('version'):
              raise SystemExit('Scout release manifest has no version')
          workbench = json.loads(Path('/tmp/workbench-build.json').read_text())
          if not str(workbench.get('version') or '').strip():
              raise SystemExit('Workbench BUILD.json has no version')
          print(f'Production Nexus is healthy at version {actual}')
          PY

      - name: Verify public endpoints from GitHub runner
        run: |
          set -euo pipefail
          for url in "$MINO_NEXUS_HEALTH_URL" "$MINO_SCOUT_MANIFEST_URL" "$MINO_WORKBENCH_URL"; do
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
              --max-time 20 "$url" > /dev/null
            echo "Reachable from GitHub runner: $url"
          done
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \
            --max-time 20 --request OPTIONS \
            --header "Origin: $MINO_WORKBENCH_PUBLIC_URL" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header /tmp/nexus-cors.headers \
            "$MINO_NEXUS_PUBLIC_URL/health" > /dev/null
          tr -d '\r' < /tmp/nexus-cors.headers | grep -Fxi "access-control-allow-origin: $MINO_WORKBENCH_PUBLIC_URL"
          echo 'Verified Workbench CORS through the public :8443 Nexus entry'
