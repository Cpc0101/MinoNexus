name: Repair production HTTPS listeners

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tencent-nexus
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_USER: ${{ vars.TENCENT_USER }}
      HOST_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure authenticated maintenance transport
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/repair
          chmod 600 ~/.ssh/repair
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" = "$HOST_FINGERPRINT"
      - name: Remove direct public-IP listener
        run: |
          set -euo pipefail
          scp -i ~/.ssh/repair -o BatchMode=yes scripts/remove-public-ip-nginx.py \
            "$TENCENT_USER@$TENCENT_HOST:/tmp/mino-remove-public-ip-$GITHUB_RUN_ID.py"
          ssh -i ~/.ssh/repair -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "python3 '/tmp/mino-remove-public-ip-$GITHUB_RUN_ID.py' && rm -f '/tmp/mino-remove-public-ip-$GITHUB_RUN_ID.py'"
      - name: Verify domain virtual hosts on Tencent
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/repair -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "curl --fail --silent --show-error --max-time 15 --resolve nexus.minocc.top:443:127.0.0.1 https://nexus.minocc.top/health > /dev/null && curl --fail --silent --show-error --max-time 15 --resolve workbench.minocc.top:443:127.0.0.1 https://workbench.minocc.top/BUILD.json > /dev/null && ss -lnt '( sport = :443 )'"
      - name: Verify real public domain
        run: |
          set -euo pipefail
          for url in https://nexus.minocc.top/health https://workbench.minocc.top/BUILD.json; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              --max-time 20 "$url" > /dev/null
            echo "Reachable: $url"
          done
