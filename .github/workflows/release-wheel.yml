name: Release Tencent image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-tencent-image-${{ github.ref }}
  cancel-in-progress: false

env:
  CNB_REPOSITORY: MinoNexusCI/mino-nexus-ci

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate tag version
        id: version
        run: |
          set -euo pipefail
          version=$(cat mino_nexus/VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mino_nexus/VERSION ($version)" >&2
            exit 1
          fi
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full Git commit SHA, got: $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$version-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger CNB image build
        env:
          CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$CNB_API_TOKEN" || { echo 'Missing repository secret CNB_API_TOKEN' >&2; exit 1; }
          request=$(jq -n \
            --arg branch main \
            --arg event api_trigger \
            --arg source_sha "$GITHUB_SHA" \
            --arg source_ref "$GITHUB_REF" \
            --arg title "Build MinoNexus $VERSION" \
            --arg sync false \
            '{
              branch: $branch,
              event: $event,
              env: {SOURCE_SHA: $source_sha, SOURCE_REF: $source_ref},
              sync: $sync,
              title: $title
            }')
          response=$(curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY/-/build/start" \
            --header 'Accept: application/vnd.cnb.api+json' \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$request")
          success=$(printf '%s' "$response" | jq -r '.success // .data.success // false')
          test "$success" = true
          sn=$(printf '%s' "$response" | jq -r '.sn // .data.sn // empty')
          build_url=$(printf '%s' "$response" | jq -r '.buildLogUrl // .url // .buildUrl // .data.buildLogUrl // .data.url // .data.buildUrl // empty')
          test -n "$sn" || { echo 'CNB build response did not contain a build SN.' >&2; exit 1; }
          echo "CNB build triggered: $sn"
          test -z "$build_url" || echo "CNB build URL: $build_url"
          echo "CNB_BUILD_SN=$sn" >> "$GITHUB_ENV"
          echo "CNB immutable image tag: $IMAGE_TAG"

      - name: Wait for CNB image build
        env:
          CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
        run: bash .github/scripts/wait-for-cnb-build.sh

  deploy-tencent:
    needs: [validate, build]
    uses: ./.github/workflows/deploy-tencent.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      image_tag: ${{ needs.validate.outputs.image_tag }}
    secrets: inherit
