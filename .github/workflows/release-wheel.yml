name: Release Tencent image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-tencent-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate tag version
        id: version
        run: |
          version=$(cat mino_nexus/VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mino_nexus/VERSION ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image identity
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mino-nexus" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.validate.outputs.version }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-tencent:
    needs: [validate, image]
    uses: ./.github/workflows/deploy-tencent.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit
