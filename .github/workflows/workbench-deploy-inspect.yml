name: Deploy Workbench to Tencent

on:
  push:
    branches: [deploy/workbench-inspect]
  workflow_dispatch:
    inputs:
      release_tag:
        description: MinoWorkbench release tag
        required: true
        default: v0.0.65

permissions:
  contents: read

concurrency:
  group: deploy-workbench-tencent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_USER: ${{ vars.TENCENT_USER }}
      TENCENT_HOST_KEY_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
      RELEASE_TAG: ${{ inputs.release_tag || 'v0.0.65' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mino-nexus-deploy
          chmod 0600 ~/.ssh/mino-nexus-deploy
          ssh-keygen -y -f ~/.ssh/mino-nexus-deploy > /dev/null
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR == 1 {print $2}')
          test "$actual" = "$TENCENT_HOST_KEY_FINGERPRINT"

      - name: Download and verify Workbench release
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_base="https://github.com/Cpc0101/MinoWorkbench/releases/download/${RELEASE_TAG}"
          install -d .deploy
          curl --fail --location --silent --show-error \
            "$release_base/workbench-web-${version}.tar.gz" \
            --output ".deploy/workbench-web-${version}.tar.gz"
          curl --fail --location --silent --show-error \
            "$release_base/SHA256SUMS.txt" \
            --output .deploy/SHA256SUMS.txt
          cd .deploy
          sha256sum --check SHA256SUMS.txt

      - name: Upload Workbench release
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          scp -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes \
            ".deploy/workbench-web-${version}.tar.gz" scripts/deploy-workbench-remote.py \
            "$TENCENT_USER@$TENCENT_HOST:/tmp/"

      - name: Deploy and verify over port 8443
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive=".deploy/workbench-web-${version}.tar.gz"
          expected_asset=$(tar -xOf "$archive" ./index.html | sed -n 's#.*src="/assets/\([^" ]*\.js\)".*#\1#p' | head -n 1)
          test -n "$expected_asset"
          case "$expected_asset" in
            *[!A-Za-z0-9._-]*) echo "Unsafe asset name: $expected_asset" >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "python3 /tmp/deploy-workbench-remote.py '/tmp/workbench-web-${version}.tar.gz' '$expected_asset'"
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "bash -s -- '$expected_asset' '$version'" <<'REMOTE'
          set -euo pipefail
          asset=$1
          version=$2
          workbench_base=https://workbench.minocc.top:8443
          nexus_base=https://nexus.minocc.top:8443
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT

          curl --fail --silent --show-error --max-time 20 \
            --resolve workbench.minocc.top:8443:127.0.0.1 \
            "$workbench_base/assets/$asset" --output /dev/null
          body=$(curl --fail --silent --show-error --max-time 20 \
            --resolve workbench.minocc.top:8443:127.0.0.1 \
            "$workbench_base/")
          printf '%s' "$body" | grep -F "/assets/$asset" > /dev/null

          build=$(curl --fail --silent --show-error --max-time 20 \
            --resolve workbench.minocc.top:8443:127.0.0.1 \
            "$workbench_base/BUILD.json")
          python3 - "$build" "$version" <<'PY'
          import json
          import sys
          data = json.loads(sys.argv[1])
          if data.get("version") != sys.argv[2]:
              raise SystemExit(f"BUILD.json version mismatch: {data.get('version')} != {sys.argv[2]}")
          print(f"WORKBENCH_VERSION={data['version']}")
          PY

          curl --fail --silent --show-error --max-time 20 \
            --resolve nexus.minocc.top:8443:127.0.0.1 \
            "$nexus_base/health" --output /dev/null
          curl --fail --silent --show-error --max-time 20 \
            --request OPTIONS \
            --header "Origin: $workbench_base" \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header "$headers" \
            --output /dev/null \
            "$nexus_base/health"
          tr -d '\r' < "$headers" | grep -Fxi "access-control-allow-origin: $workbench_base" > /dev/null
          echo "WORKBENCH_ASSET=$asset"
          echo "WORKBENCH_BASE=$workbench_base"
          echo "NEXUS_BASE=$nexus_base"
          REMOTE
