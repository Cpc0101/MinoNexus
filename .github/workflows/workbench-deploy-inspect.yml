name: Deploy Workbench to Tencent

on:
  push:
    branches: [deploy/workbench-inspect]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workbench-tencent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_USER: ${{ vars.TENCENT_USER }}
      TENCENT_HOST_KEY_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mino-nexus-deploy
          chmod 0600 ~/.ssh/mino-nexus-deploy
          ssh-keygen -y -f ~/.ssh/mino-nexus-deploy > /dev/null
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR == 1 {print $2}')
          test "$actual" = "$TENCENT_HOST_KEY_FINGERPRINT"

      - name: Upload Workbench release
        run: |
          set -euo pipefail
          scp -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes \
            .deploy/workbench-web-0.0.61.tar.gz scripts/deploy-workbench-remote.py \
            "$TENCENT_USER@$TENCENT_HOST:/tmp/"

      - name: Deploy and verify
        run: |
          set -euo pipefail
          expected_asset=$(tar -xOf .deploy/workbench-web-0.0.61.tar.gz ./index.html | sed -n 's#.*src="/assets/\([^"]*\)".*#\1#p' | head -n 1)
          test -n "$expected_asset"
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" \
            "python3 /tmp/deploy-workbench-remote.py /tmp/workbench-web-0.0.61.tar.gz '$expected_asset'"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://workbench.minocc.top/assets/$expected_asset" --output /dev/null
          body=$(curl --fail --silent --show-error "https://workbench.minocc.top/")
          printf '%s' "$body" | grep -F "/assets/$expected_asset" > /dev/null
          ! printf '%s' "$body" | grep -F "nexus.minocc.top:8443"
