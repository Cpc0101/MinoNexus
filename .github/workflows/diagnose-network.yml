name: Diagnose production network
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_USER: ${{ vars.TENCENT_USER }}
      HOST_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
    steps:
      - name: Configure authenticated diagnostic transport
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/diagnose
          chmod 600 ~/.ssh/diagnose
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          test "$actual" = "$HOST_FINGERPRINT"
      - name: Read server transport state
        run: |
          ssh -i ~/.ssh/diagnose -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          ss -ltnp | awk 'NR==1 || /:(443|8443|18443|80|8000) /'
          nginx -T 2>&1 | awk '/^[[:space:]]*(listen |server_name |ssl_certificate |proxy_pass |proxy_set_header Upgrade|proxy_set_header Connection)/'
          ufw status 2>/dev/null || true
          du -sh /var/www/scout-release/.incoming-* /var/www/scout-release/v0.1.156 2>/dev/null || true
          df -h /var/www/scout-release
          curl --fail --silent --show-error --max-time 15 https://github.com/Cpc0101/MinoScout/releases/download/v0.1.156/manifest.json | python3 -c 'import json,sys; m=json.load(sys.stdin); print("GitHub release reachable from server:", m["version"])' || true
          curl --fail --silent --show-error --max-time 10 --resolve nexus.minocc.top:443:127.0.0.1 https://nexus.minocc.top/health
          curl --fail --silent --show-error --max-time 10 https://nexus.minocc.top/health
          REMOTE
      - name: Compare public TLS entry points
        run: |
          for host in nexus.minocc.top workbench.minocc.top; do
            for port in 443 8443 18443; do
              echo "TLS probe $host:$port"
              curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}\n' "https://$host:$port/health" || true
            done
          done
