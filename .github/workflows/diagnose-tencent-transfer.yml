name: Diagnose Tencent transfer

on:
  push:
    branches: [deploy/diagnose-transfer]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    env:
      TENCENT_HOST: ${{ vars.TENCENT_HOST }}
      TENCENT_USER: ${{ vars.TENCENT_USER }}
      TENCENT_HOST_KEY_FINGERPRINT: ${{ vars.TENCENT_HOST_KEY_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mino-nexus-deploy
          chmod 0600 ~/.ssh/mino-nexus-deploy
          ssh-keyscan -T 15 -t ed25519 "$TENCENT_HOST" > ~/.ssh/known_hosts
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR == 1 {print $2}')
          test "$actual" = "$TENCENT_HOST_KEY_FINGERPRINT"

      - name: Sample transfer state
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" '
            set -e
            iface=$(ip route show default | awk "{print \$5; exit}")
            rx1=$(awk -v iface="$iface:" "\$1 == iface {print \$2}" /proc/net/dev)
            tx1=$(awk -v iface="$iface:" "\$1 == iface {print \$10}" /proc/net/dev)
            sleep 20
            rx2=$(awk -v iface="$iface:" "\$1 == iface {print \$2}" /proc/net/dev)
            tx2=$(awk -v iface="$iface:" "\$1 == iface {print \$10}" /proc/net/dev)
            echo "INTERFACE=$iface"
            echo "RX_BYTES_PER_SECOND=$(((rx2 - rx1) / 20))"
            echo "TX_BYTES_PER_SECOND=$(((tx2 - tx1) / 20))"
            echo "--- transfer processes ---"
            ps -eo pid,etime,stat,%cpu,%mem,cmd | grep -E "docker load|gzip -dc|ssh" | grep -v grep || true
            echo "--- docker processes ---"
            docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}" || true
            echo "--- image store ---"
            docker images --format "{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}" | head -n 20 || true
            echo "--- disk ---"
            df -h /
          '

      - name: Probe remote GHCR access
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/mino-nexus-deploy -o BatchMode=yes "$TENCENT_USER@$TENCENT_HOST" '
            set +e
            timeout 30 docker manifest inspect ghcr.io/cpc0101/mino-nexus:0.1.96 > /dev/null
            echo "GHCR_MANIFEST_EXIT=$?"
            curl --silent --show-error --output /dev/null --write-out "GHCR_HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n" \
              --connect-timeout 10 --max-time 30 https://ghcr.io/v2/
            echo "GHCR_CURL_EXIT=$?"
            curl --silent --show-error --output /dev/null --write-out "GITHUB_HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n" \
              --connect-timeout 10 --max-time 30 https://github.com/
            echo "GITHUB_CURL_EXIT=$?"
          '
