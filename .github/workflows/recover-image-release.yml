name: Recover CNB image release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released Nexus version, with or without the leading v
        required: true
        type: string
      commit:
        description: Full commit SHA for the existing version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-cnb-image-release
  cancel-in-progress: false

env:
  CNB_REPOSITORY: MinoNexusCI/mino-nexus-ci

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          version=${REQUESTED_VERSION#v}
          commit=${REQUESTED_COMMIT,,}
          test "$(cat mino_nexus/VERSION)" = "$version"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid full commit SHA: $REQUESTED_COMMIT" >&2
            exit 1
          fi
          test "$(git rev-parse "v$version^{commit}")" = "$commit"
          echo "IMAGE_TAG=$version-$commit" >> "$GITHUB_ENV"
      - name: Rebuild image through CNB
        env:
          CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CNB_API_TOKEN" || { echo 'Missing repository secret CNB_API_TOKEN' >&2; exit 1; }
          sha=${IMAGE_TAG##*-}
          request=$(jq -n \
            --arg branch main \
            --arg event api_trigger \
            --arg source_sha "$sha" \
            --arg source_ref "refs/tags/v${IMAGE_TAG%-*}" \
            --arg title "Recover MinoNexus $IMAGE_TAG" \
            --arg sync false \
            '{
              branch: $branch,
              event: $event,
              env: {SOURCE_SHA: $source_sha, SOURCE_REF: $source_ref},
              sync: $sync,
              title: $title
            }')
          response=$(curl --fail-with-body --silent --show-error \
            --max-time 120 \
            --request POST \
            --url "https://api.cnb.cool/$CNB_REPOSITORY/-/build/start" \
            --header 'Accept: application/vnd.cnb.api+json' \
            --header "Authorization: $CNB_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$request")
          success=$(printf '%s' "$response" | jq -r '.success // .data.success // false')
          test "$success" = true
          sn=$(printf '%s' "$response" | jq -r '.sn // .data.sn // empty')
          build_url=$(printf '%s' "$response" | jq -r '.buildLogUrl // .url // .buildUrl // .data.buildLogUrl // .data.url // .data.buildUrl // empty')
          test -n "$sn" || { echo 'CNB build response did not contain a build SN.' >&2; exit 1; }
          echo "CNB recovery build triggered: $sn"
          test -z "$build_url" || echo "CNB build URL: $build_url"
          echo "CNB_BUILD_SN=$sn" >> "$GITHUB_ENV"
          echo "CNB recovered immutable image tag: $IMAGE_TAG"

      - name: Wait for CNB recovery build
        env:
          CNB_API_TOKEN: ${{ secrets.CNB_API_TOKEN }}
        run: bash .github/scripts/wait-for-cnb-build.sh
