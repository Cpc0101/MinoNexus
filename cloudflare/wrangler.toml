name = "mino-nexus"
main = "src/index.ts"
compatibility_date = "2026-11-08"
workers_dev = true

# Public hub endpoint
[[routes]]
pattern = "nexus.minocc.top"
custom_domain = true

[observability]
enabled = true

# Shared scout/device state (free tier). DO only keeps hibernated WebSockets.
[[d1_databases]]
binding = "DB"
database_name = "mino-nexus"
database_id = "df824c12-b7f7-440b-87e0-59bd6d89c87b"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "NEXUS_HUB"
class_name = "NexusHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NexusHub"]

# SCOUT_PAIR_TOKEN / MCP_BEARER_TOKEN: local via .dev.vars, production via `wrangler secret put`.
# Do not put them in [vars] — that overwrites remote secrets on deploy.
