name = "mino-nexus"
main = "src/index.ts"
compatibility_date = "2026-11-08"
workers_dev = true

[observability]
enabled = true

# Free-tier path: one SQLite-backed Durable Object holds Scout sockets + device state.
[[durable_objects.bindings]]
name = "NEXUS_HUB"
class_name = "NexusHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NexusHub"]

# SCOUT_PAIR_TOKEN / MCP_BEARER_TOKEN: local via .dev.vars, production via `wrangler secret put`.
# Do not put them in [vars] — that overwrites remote secrets on deploy.
